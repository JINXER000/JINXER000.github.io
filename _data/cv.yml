- title: Research Projects
  type: time_table
  contents:
    - title: "Demonstration Skill Decomposition and Online Reorganization (ITF Research Talent Hub), Project Lead"
      year: 2024 - now
      description:
        - "<b>Overview</b>: Designed the TAMP-gated multi-skill imitation learning framework; developed algorithms for skill decomposition, geometric safety checking, and online replanning; led real-world experimental validations on dual-arm robotic hardware."
        - "<b>Result</b>: Decomposed expert demonstrations into reusable primitives for online task reorganization, reaching over 4x the success rate of the mainstream pi-0.5 baseline in few-shot and out-of-distribution settings; conditionally accepted by IEEE T-RO and released as open source."
      linkitems:
        - linkname: Homepage / Code
          link: https://dr-lfd.github.io/DR-LfD-website/
    - title: "Fine Bimanual Manipulation for Flexible Assembly (Huawei), Co-Lead"
      year: 2024 - 2025
      description:
        - "<b>Overview</b>: Designed a VLM-based task understanding module for bimanual coordination mode recognition and keypose classification; introduced a consistency model to reduce policy inference latency; assisted in deploying and validating the algorithms on dual-arm Franka robot setups."
        - "<b>Result</b>: Deployed on dual-arm Franka platforms and accepted by IEEE T-ASE (Funding: RMB 1,000,000)."
      linkitems:
        - linkname: Code
          link: https://github.com/JoanaHXU/BiKC-plus
    - title: "Intelligent Navigation and Robust Flight Control for Unmanned Systems (Hong Kong RGC-GRF), Participant / Direction Lead"
      description:
        - "<b>Overview</b>: Formulated and implemented CUDA-accelerated incremental ESDF algorithms; built the GPU parallel mapping and online planning pipeline; conducted deployment and flight/driving tests on UGV and UAV hardware platforms."
        - "<b>Result</b>: Achieved a 3x speedup in distance field updating and a 10x improvement in environment representation precision; released publicly one year ahead of NVIDIA nvblox with comparable mapping speed and higher distance-field precision; published in RA-L 2022 and presented at RCAR 2021 and IROS 2022."
      linkitems:
        - linkname: Code
          link: https://github.com/JINXER000/GIE-mapping
    - title: "Advanced Motion Planning for Multi-Agent Systems Coordination (Hong Kong RGC-GRF), Participant / Direction Lead"
      description:
        - "<b>Overview</b>: Developed sampling-based task and motion planning algorithms under linear temporal logic (LTL) constraints for multi-stage tasks with strict temporal and safety requirements; built an interactive multi-task system supporting online goal and constraint adjustments; validated on mobile robots, quadrotors, and aerial manipulators."
        - "<b>Result</b>: Cut replanning reaction time by 5x; published at ICRA 2023, IROS 2023, and ROBIO 2024 (Best Paper in Automation Finalist), and filed as a Chinese invention patent."
      linkitems:
        - linkname: Code
          link: https://github.com/JINXER000/multiple-task-temporal-logic-planning

